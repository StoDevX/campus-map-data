name: Scrape campus data

on:
  # Monthly, on the 1st at 06:00 UTC. Campus data changes a handful of times a
  # year — a building renamed, a lot restriped — so a daily poll was almost all
  # no-op runs. Anything that needs to land sooner can be dispatched by hand,
  # and a push that changes how the data is derived still rebuilds immediately.
  #
  # Deliberately not the tile workflow's cadence. That one tracks OpenStreetMap,
  # which changes daily, and runs daily to match carls-app/map-tiles; this one
  # tracks the college's ArcGIS services, which do not.
  schedule:
    - cron: "0 6 1 * *"

  workflow_dispatch:

  # Anything that changes how the data is derived should regenerate it, not wait
  # for the cron. Note this deliberately does not include `data/**`, `map.json`
  # or `map.geojson` — those are what this workflow commits, and triggering on
  # them would make it re-trigger itself forever.
  push:
    branches: [main]
    paths:
      - scripts/**
      - overrides.yaml
      # A watch's snapshot, merged from its pull request: verify.py checks the
      # data against it, and should fail then rather than at the next monthly
      # run. The scrape never writes data/watches, so this cannot loop.
      - data/watches/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/scrape.yml

  # Dry run on every PR: scrape, build, check, commit nothing. Without this the
  # workflow could only be exercised by merging it.
  pull_request:

# To push the regenerated data back to main.
# `actions` to dispatch the release workflow.
permissions:
  contents: write
  actions: write

concurrency:
  # PRs get their own group so a dry run can never queue behind, or cancel, a
  # scheduled scrape.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('scrape-dryrun-{0}', github.ref)
        || 'scrape' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # The interpreter comes from mise.toml/mise.lock and the packages from
      # uv.lock, so CI runs exactly what a local `mise install` gives you.
      - run: uv sync --locked

      - name: Scrape the ArcGIS layers
        run: uv run scripts/scrape.py

      - name: Scrape floor plans from wp.stolaf.edu
        # Deliberately non-fatal. The college's WordPress being down is not a
        # reason to throw away a good ArcGIS scrape: build.py falls back to the
        # committed data/residence-life.json, so the floor plans stay at their
        # last known good values and everything else still updates. The step
        # shows as failed in the run, and the summary below says so.
        id: enrich
        continue-on-error: true
        run: uv run scripts/enrich.py

      - name: Build map.json and map.geojson
        run: uv run scripts/build.py

      - name: Build the routing graph
        # The georeferencing fit is anchored on the scraped walkways and the
        # building label anchors, so a change to either moves the graph.
        run: uv run scripts/build_routing.py

      - name: Verify
        # Non-fatal here so the change report below still gets built when the
        # data fails verification: that is when a person most wants to see what
        # moved. The last step of the job fails the run for it.
        id: verify
        continue-on-error: true
        run: uv run scripts/verify.py

      - name: Build the change report
        id: report
        # A broken report must not hide the scrape's own result.
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # bash with pipefail, so a crash in report.py is not hidden by tee.
        shell: bash
        run: |
          # On a pull request the data is compared with the base branch; on any
          # other run, with the commit the run started from.
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            before="origin/$BASE_REF"
          else
            before=HEAD
          fi

          uv run scripts/report.py \
            --before "$before" --date "$(date -u +%F)" \
            --out "$RUNNER_TEMP/report.html" | tee "$RUNNER_TEMP/report-summary.txt"

          # report.py writes nothing when the published data did not change.
          if [ -f "$RUNNER_TEMP/report.html" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the change report
        # A scheduled run that verifies is released by release.yml instead, so
        # the page is only an artifact for a pull request or a failed verify.
        if: >-
          steps.report.outputs.built == 'true'
          && (github.event_name == 'pull_request' || steps.verify.outcome != 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change-report
          path: ${{ runner.temp }}/report.html
          if-no-files-found: error

      - name: Summarise
        env:
          EVENT: ${{ github.event_name }}
          REPORT_BUILT: ${{ steps.report.outputs.built }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            if [ -f "$RUNNER_TEMP/report-summary.txt" ]; then
              cat "$RUNNER_TEMP/report-summary.txt"
              echo
            fi
            echo "## Campus data"
            echo
            echo "| | |"
            echo "| --- | ---: |"
            echo "| places | $(python3 -c 'import json;print(len(json.load(open("map.json"))))') |"
            echo "| with a footprint | $(python3 -c 'import json;print(sum(1 for r in json.load(open("map.json")) if r["outline"]))') |"
            echo "| raw features | $(python3 -c 'import json,glob;print(sum(len(json.load(open(f))["features"]) for f in glob.glob("data/*.geojson")))') |"
            echo
            if [ "${{ steps.enrich.outcome }}" != "success" ]; then
              echo "> [!WARNING]"
              echo "> The wp.stolaf.edu scrape failed; floor plans are unchanged from the last good run."
              echo
            fi
            if [ "$VERIFY_OUTCOME" != "success" ]; then
              echo "> [!CAUTION]"
              echo "> The data failed verification; nothing was committed."
              echo
            fi
            echo '### Changes'
            echo
            if [ "$REPORT_OUTCOME" != "success" ]; then
              echo "The change report failed to build; see the step's log."
            elif [ "$REPORT_BUILT" != "true" ]; then
              echo "No change to the published data, so no change report."
            elif [ "$EVENT" = pull_request ]; then
              echo "The change report is attached to this run as the \`change-report\` artifact."
              echo "It compares the base branch with data regenerated from today's live layers, so it can include college edits that are not this pull request's."
            elif [ "$VERIFY_OUTCOME" != "success" ]; then
              echo "The change report is attached to this run as the \`change-report\` artifact."
            else
              echo "A release and a change report follow from the release workflow."
            fi
            echo
            if git diff --quiet; then
              echo "None — the published data already matches the source."
            else
              echo '```'
              git diff --stat
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        id: commit
        if: github.event_name != 'pull_request' && steps.verify.outcome == 'success'
        # Only when something actually moved. A no-op commit on every run would
        # destroy the thing that makes committing this data worth doing: the
        # history being a readable log of what changed on campus and when.
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data map.json map.geojson routing.json
          git commit -m "Update campus data ($(date -u +%Y-%m-%d))" \
            -m "Scraped from the college's ArcGIS services by ${GITHUB_WORKFLOW} (run ${GITHUB_RUN_ID})."

          # The scheduled run races nothing but itself, and concurrency already
          # prevents that. A rebase covers a human push landing mid-run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              # The bot's commit is the tip, so its parent is where the data
              # changed from, even if a rebase put it on a person's commit.
              {
                echo "before=$(git rev-parse HEAD^)"
                echo "after=$(git rev-parse HEAD)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push failed, rebasing and retrying ($attempt/3)"
            git pull --rebase origin main
          done
          exit 1

      - name: Release the change
        # Separate from the push, and non-fatal: nothing here can undo the
        # data that is already on main. The release workflow writes the report
        # page and the release; a push made with GITHUB_TOKEN starts no workflow
        # of its own, so it has to be asked.
        if: steps.commit.outputs.after != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.commit.outputs.before }}
          AFTER: ${{ steps.commit.outputs.after }}
        run: gh workflow run release.yml --ref main -f before="$BEFORE" -f after="$AFTER"

      - name: Fail on a bad verify
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::verify.py failed; see the Verify step."
          exit 1
