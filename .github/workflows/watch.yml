name: Watch pages

on:
  # Weekly, Mondays at 06:30 UTC. The watched pages change a few times a year;
  # a change should not sit unnoticed for a month.
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
  # Dry run on a PR that touches the watch: fetch, compare, write nothing.
  pull_request:
    paths:
      - watches.yaml
      - scripts/watch.py
      - .github/workflows/watch.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('watch-dryrun-{0}', github.ref) || 'watch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked

      - name: Check
        if: github.event_name == 'pull_request'
        run: uv run scripts/watch.py --check

      - name: Snapshot
        if: github.event_name != 'pull_request'
        run: uv run scripts/watch.py

      - name: Open or update the pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/watches; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/watch
          git add data/watches
          git commit -m "Update the watched pages' snapshots"
          git push --force origin bot/watch
          open=$(gh pr list --head bot/watch --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "Updated existing pull request #${open}."
            exit 0
          fi
          gh pr create --base main --head bot/watch \
            --title "A watched page changed" \
            --body "$(cat <<'BODY'
          A page in watches.yaml changed. Read the diff: each watch's `why` in
          watches.yaml says what the change asks of us.

          Merging acknowledges the change. verify.py may then fail until the
          data is updated to match -- for the Wellness Walks, `walks:` in
          overrides.yaml.
          BODY
          )"
