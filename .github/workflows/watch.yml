name: Watch pages

on:
  # Weekly, Mondays at 06:30 UTC. The watched pages change a few times a year;
  # a change should not sit unnoticed for a month.
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
  # Dry run on a PR that touches the watch: fetch, compare, write nothing.
  pull_request:
    paths:
      - watches.yaml
      - scripts/watch.py
      - .github/workflows/watch.yml

# Read-only unless a job asks for more: the dry run needs nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('watch-dryrun-{0}', github.ref) || 'watch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked
      - run: uv run scripts/watch.py --check

  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked

      - name: Snapshot
        run: WATCH_REPORT="$RUNNER_TEMP/watch.md" uv run scripts/watch.py

      # A snapshot that changed can leave the data behind the page -- verify.py
      # checks the walks against theirs. Its result goes in the pull request,
      # which GITHUB_TOKEN's own checks never run on.
      - name: Verify against the new snapshots
        id: verify
        continue-on-error: true
        run: uv run scripts/verify.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ steps.verify.outcome }}
        run: |
          # Staged first, so a new watch's first snapshot counts as a change:
          # `git diff` alone does not see an untracked file.
          git add -A data/watches
          if git diff --cached --quiet -- data/watches; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          open=$(gh pr list --head bot/watch --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            # Build on the open pull request, keeping anything a person pushed
            # to it -- the matching overrides.yaml change, say. Add a commit
            # only if the page moved again since.
            git fetch -q origin bot/watch
            if git diff --cached --quiet origin/bot/watch -- data/watches; then
              echo "Pull request #${open} already has this change."
              exit 0
            fi
            cp -R data/watches "$RUNNER_TEMP/watches"
            git reset -q -- data/watches
            git checkout -q -- data/watches
            git clean -fdq -- data/watches
            git checkout -q -B bot/watch origin/bot/watch
            rm -rf data/watches
            cp -R "$RUNNER_TEMP/watches" data/watches
            git add data/watches
            git commit -q -m "Update the watched pages' snapshots"
            git push origin bot/watch
            echo "Updated pull request #${open}."
            exit 0
          fi

          # No pull request is open, so nothing on the branch is anyone's work.
          git checkout -q -B bot/watch
          git add data/watches
          git commit -q -m "Update the watched pages' snapshots"
          git push --force origin bot/watch

          {
            echo "A watched page changed:"
            echo
            cat "$RUNNER_TEMP/watch.md"
            echo
            if [ "$VERIFIED" = success ]; then
              echo "verify.py passes against the new snapshots."
            else
              echo "verify.py **fails** against the new snapshots: update the data on this branch before merging. The run's log has the failures."
            fi
            echo
            echo "Merging acknowledges the change."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head bot/watch \
            --title "A watched page changed" \
            --body-file "$RUNNER_TEMP/body.md"
