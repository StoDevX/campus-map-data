# Tool versions for this repo, with mise.lock recording the exact URL and
# sha256 per platform. CI installs from it with jdx/mise-action; locally
# `mise install` gets you the same versions.

[settings]
lockfile = true

[tools]
python = "3.14"
node = "26.7.0"

# Resolves the interpreter and the locked packages for the scripts.
uv = "0.12.3"

# Linting. Both are single static binaries, which is why they belong here rather
# than in a package manifest. build-tiles.sh is the whole tile pipeline and runs
# unattended on a schedule, so an unquoted expansion is a silent bad publish;
# and every workflow bug so far has only shown up when a run actually happened,
# which needs a merge.
actionlint = "1.7.12"
shellcheck = "0.11.0"

# The PMTiles CLI: does the planet extract and the tier merge in build-tiles.sh.
"github:protomaps/go-pmtiles" = { version = "v1.31.2", exe = "pmtiles" }
