# Hand-maintained corrections layered over the scraped data.
#
# The scrape must stay a faithful copy of what St. Olaf publishes — that is what
# makes its diff a usable change log. Anything we know better than the source
# goes here instead, where it is reviewable and survives the next scrape. Same
# job as `carls-app/map-data`'s overrides.yaml.
#
# Four sections, applied in this order:
#
#   ids        Layer slug -> source name -> id. The default id is the name with
#              its spaces and punctuation removed ("New Hall" -> newhall); this
#              is for the ones that produces something unusable.
#   removals   Ids to drop from map.json / map.geojson entirely.
#   changes    Fields merged onto a place, keyed by id. Any field of a record
#              can be set; `centerpoint` sets the label anchor, and `parent`
#              names the building a place sits inside.
#   additions  Whole records to append, in map.json's shape.
#
# COORDINATE ORDER: `centerpoint` is [longitude, latitude] — GeoJSON order, and
# the same order carls-app/map-data uses. Note that map.json's own `center` and
# `outline` are latitude-first; that inconsistency is Carleton's and is
# reproduced deliberately so consumers do not have to change. See build.py.

ids:
  # Buildings are keyed by the college's own abbreviation, from the ABB field of
  # the buildings layer. These are the identifiers on the signage and in campus
  # speech — RNS, BMC, TOH — so they are what someone hardcoding a building in
  # AAO would reach for, and they are stable in a way a name is not: Regents Hall
  # of Mathematical Sciences can be renamed without RMS changing. All 31 are
  # unique.
  #
  # Listed here rather than read from ABB at build time, deliberately. An id is a
  # primary key, and deriving it from a mutable source field would let a college
  # edit to ABB silently repoint every reference to that building. Pinned here,
  # such an edit is a diff in this file instead.
  #
  # Keyed by layer first, because a bare name is ambiguous: the parking lot
  # beside Old Main is also called "Old Main", and a flat name -> id map gave
  # both of them `om`. Within a layer, the key is the *source* name, matched
  # before the spelling corrections under `changes` — hence "Hillboe" and
  # "Kittlesby" here and the corrected spellings there. verify.py fails if an
  # entry stops applying.
  buildings:
    "Flaten Art Barn": ab
    "Ade Christenson Complex": aca
    "Alumni Hall": ahl
    "(Agnes) Kittlesby Hall": akh
    "(Agnes) Larson Hall": alh
    "(Agnes) Mellby Hall": amh
    "Buntrock Commons": bc
    "Boe Memorial Chapel": bmc
    "Center for Art and Dance": cad
    "Christiansen Hall of Music": chm
    "Ellingson Hall": eh
    "(Gertrude) Hillboe Hall": ghh
    "Holland Hall": hh
    "Hoyme Hall": hmh
    "(Tweet) Hall of Music": hom
    "Kildahl Hall": kh
    "Madson Facilities Building": mfb
    "Mohn Hall": mh
    "Old Main": om
    "Rand Hall": rh
    "Rolvaag Memorial Library": rml
    "Regents Hall of Mathematical Sciences": rms
    "Regents Hall of Natural Sciences": rns
    "Skoglund Athletic Center and Auditorium": sac
    "Steensland Hall": sh
    "Skifter Hall": skh
    "Theater Building": tb
    "Thorson Hall": th
    "Tomson Hall": toh
    "Tom Porter Hall": tph
    "Ytterboe Hall": ytt

  # The seven buildings the college gives no abbreviation — New Hall, the
  # Townhouses, Tostrud Center, STOGROW Farm, the President's House, the Pump
  # House and the Water Tank — keep the default slugified name, which for all
  # seven reads fine: `newhall`, `tostrudcenter`, `watertank`.

  # Not buildings, so no abbreviation exists; these are just unwieldy names.
  athletic-fields:
    "Klein Field at Manitou & Manitou Track": field-kleinfield
  points-of-interest:
    "Buntrock Commons Parking Lot - Electric Vehicle Charger": evcharger
  # Pinned so the id survives the college correcting the spelling upstream.
  natural-lands-trails:
    "Windmilll Trail": trail-windmilltrail

removals:
  # An access road the trails layer carries as a trail. Its row is typed
  # "Access Trail"; it is the only named one.
  - id: trail-campusdrive

changes:
  # Spelling corrections. The ArcGIS layer disagrees with the college's own
  # Residence Life pages, which title that page "Hilleboe and Kittelsby Halls",
  # and with the building signage.
  - id: ghh
    name: (Gertrude) Hilleboe Hall
  - id: akh
    name: (Agnes) Kittelsby Hall

  # The source name is a 54-character sentence that renders as a three-line
  # label sitting across the whole of Buntrock's parking lot. It is a charging
  # point; the lot it is in is already labelled.
  - id: evcharger
    name: Electric Vehicle Charger

  # The layer says "Course"; its own description says "the courts", and there
  # are several of them.
  - id: field-carlsontenniscourse
    name: Carlson Tennis Courts

  # The layer spells it with three l's.
  - id: trail-windmilltrail
    name: Windmill Trail

  # Label anchors are computed (see geometry.py) and every one of the 96
  # polygonal places currently lands inside its own footprint. Add a
  # `centerpoint: [lon, lat]` here for any that reads badly on the map —
  # a centroid that is technically inside an L-shaped building can still sit in
  # a corner nobody thinks of as the building's middle.

  # The building each of these sits inside. Seven of the ten places in the
  # points-of-interest layer are rooms or counters within a building, and carry
  # a bare point rather than a footprint of their own — so a consumer asked to
  # frame or highlight one has no area to draw, and falls back to the parent's.
  #
  # Hand-written rather than derived, for the same reason the ids above are. The
  # source layer names the building in its own label for five of these, but
  # turning "Buntrock Commons - Dining" into `bc` is string matching against a
  # mutable field. Point-in-polygon agrees with every one it can resolve and
  # contradicts none — but it cannot see the Admissions Office, whose point
  # falls inside no footprint at all, and it would pick arbitrarily between two
  # buildings if footprints ever overlapped.
  - id: thecage
    parent: bc
  - id: thelionspause
    parent: bc
  - id: stavhall
    parent: bc
  - id: thekingsdiningroom
    parent: bc
  - id: visitorinformationdesk
    parent: bc
  - id: stolafcollegebookstore
    parent: bc
  - id: admissionsoffice
    parent: toh

  # The Windmill, the Wind Chime Memorial and the Electric Vehicle Charger are
  # the other three points, and are in no building. They get no parent.

  # About text for the Natural Lands' ponds and trails, in our own words, from
  # the college's History of the Natural Lands and Habitats pages, its 2024
  # restoration map (which planting a place sits in, where the text does not
  # name it), and a 2020 student bird survey:
  #   https://wp.stolaf.edu/naturallands/visitor-information-and-rules/history-of-the-natural-lands/
  #   https://wp.stolaf.edu/naturallands/habitats-of-the-natural-lands/
  #   https://wp.stolaf.edu/naturallands/2024/03/18/bird-diversity-and-prairie-restoration/
  # Places those sources say nothing specific about get no text.
  - id: pond-bigpond
    description: >-
      The largest of the Natural Lands' wetlands, with up to 9 acres of open
      water. It drained dry until a weir gate went in with the 1993
      restorations; now as many as 500 waterfowl rest here at once during spring
      and fall migration.
  - id: pond-baseballpond
    description: >-
      North of the pond stand the first forests the Natural Lands planted, in
      1988 and 1989, on farmland the college took out of production.
  - id: pond-southeavespond
    description: >-
      Borders the James Farm prairie, the newest in the Natural Lands: 9 acres
      of farmland sown with more than 125 native species in 2023. Drain tiles
      pulled from the field then should make the pond wetter.
  - id: pond-woodlandpond
    description: >-
      Sits in forest planted from 1998 to 2004 on farmland west of the Windmill
      Trail.
  - id: pond-eastcoyotepond
    description: >-
      In the Natural Lands' oak savanna: bur and red oaks left standing when a
      small oak planting was thinned to keep the prairie open. In a 2020 student
      bird survey, the edge where its prairie meets the savanna drew more kinds
      of birds than open prairie.
  - id: pond-westcoyotepond
    description: >-
      In the Natural Lands' oak savanna: bur and red oaks left standing when a
      small oak planting was thinned to keep the prairie open.
  - id: pond-dragonflypond
    description: >-
      Sits in open prairie sown in 2004. A 2020 student bird survey used it as a
      pure-prairie site, and found the Natural Lands' prairies home to the birds
      of tallgrass prairie, such as American goldfinches and yellow-rumped
      warblers.
  - id: trail-bigpondloop
    description: >-
      Circles Big Pond and the prairie planted around it in 1993. In 2001,
      fireworks at a presidential inauguration ball set the prairie north of the
      loop alight; the fire burned out against the trail and Campus Drive.
  - id: trail-baseballpondloop
    description: >-
      Runs through the 1988 and 1989 plantings, the Natural Lands' first
      forests: 20 to 30 native tree species set out at about 500 trees an acre.
  - id: trail-knollloop
    description: >-
      Winds through a forest planted in 1989, one of the Natural Lands' first.
  - id: trail-prairieloop
    description: &prairie >-
      Crosses prairie sown from 2002 to 2004 on about 100 acres of former
      farmland, restored under a federal wildlife easement. It is burned every
      four to six years to keep it prairie.
  - id: trail-eastprairieloop
    description: *prairie
  - id: trail-westprairieloop
    description: *prairie
  - id: trail-conifertrail
    description: >-
      Runs along conifers planted in 1993 and 1999 to stand in for the forests
      of northern Minnesota: mostly white, jack and red pine, with fir, spruce,
      cedar and tamarack.
  - id: trail-windmilltrail
    description: >-
      Follows a natural gas pipeline laid through the Natural Lands in 2007,
      past Big Ole, the college's wind turbine. The young trees on either side
      were seeded in 2002.
  - id: trail-forestrestorationloop1
    description: &forest-1990 >-
      One of two forests planted in 1990 at about 500 trees an acre, on farmland
      the college enrolled in a federal conservation program. Some seedlings
      grew in plastic tubes, an early test of how to help them survive.
  - id: trail-forestrestorationloop2
    description: *forest-1990
  - id: trail-norwayvalleytrail
    description: >-
      Norway Valley is the oldest forest on campus, 15 acres of maple and
      basswood. Its big trees were logged before the college bought the land in
      the 1800s, and spring wildflowers cover the ground before the leaves come
      out.
  - id: trail-ellingsonwoodstrail
    description: >-
      The woods below Ellingson Hall were one of only three natural areas on
      campus in 1980, when the Natural Lands began. North of the trail is a 1992
      planting of hand-set seedlings on what had been mown lawn.
  - id: trail-robintrail
    description: &heath-2009 >-
      In Heath Creek's forest, by the 2009 planting: the first restoration
      there, where a corn field was seeded straight to trees.
  - id: trail-bigwoodstrail
    description: *heath-2009
  - id: trail-lowerheathcreektrail
    description: >-
      Follows Heath Creek, which flows on to the Cannon River, past a 2017
      planting, the first to include trees suited to a warmer climate, such as
      Kentucky coffee tree and swamp white oak.
  - id: trail-burroaktrail
    description: >-
      Crosses the Heath Creek forest, about 75 acres around a stretch of the
      creek.

additions: []

# The Heath Creek trails, as the college's Natural Lands distance map (Jan
# 2026, page 2, wp.stolaf.edu/naturallands/maps-2/) names them, built from the
# natural-lands-segments layer by FID. The campus map layer's own "Heath Creek
# Trail" and "Big Woods Trail" are rough lines, up to 147 m off the path, and
# are superseded. Whole segments, except one cut at Burr Oak's north end, which
# gives Big Woods the connector the map draws as part of it. `until` and `from`
# follow the segment as the college drew it: FID 23 runs north from Burr Oak,
# so Burr Oak takes it until the cut and Big Woods from it. `miles` is each
# trail's length when this was written; build.py refuses a trail that moves
# more than 0.05 mi from it, and a missing FID.
trails:
  supersedes: ["Heath Creek Trail", "Big Woods Trail"]
  trails:
    - name: Robin Trail
      segments: [95, 30, 31, 94, 65, 38, 32]
      miles: 0.31
    - name: Big Woods Trail
      segments: [17, 48, 93, {fid: 23, from: [-93.18855, 44.45332]}]
      miles: 0.33
    - name: Burr Oak Trail
      segments: [{fid: 23, until: [-93.18855, 44.45332]}, 89, 90]
      miles: 0.55
    - name: Lower Heath Creek Trail
      segments: [88, 83, 54, 86, 20, 21, 22]
      miles: 0.58

# The Natural Lands rules, restated from the college's visitor information and
# FAQ pages in our own words, on every pond and trail -- not the athletic
# fields, which are outdoors but not Natural Lands. `replace` swaps a shared
# rule for one place: the FAQ names Norway Valley as a non-biking area.
rules:
  href: https://wp.stolaf.edu/naturallands/visitor-information-and-rules/
  categories: [water, trail]
  shared:
    - Open to the public from 5 AM to 10 PM, and to St. Olaf students, faculty, and staff at all hours.
    - Dogs on a 6-foot leash.
    - Bikes allowed, except where signs say no bikes.
    - No camping or fires.
  replace:
    trail-norwayvalleytrail:
      "Bikes allowed, except where signs say no bikes.": No bikes.

# The Wellness Walks the Natural Lands publishes, by hand: the page changes
# rarely, and scripts/watch.py raises a pull request when it does. A walk
# along a whole trail tags that trail; one along part of a trail -- the two
# halves of Prairie Loop the guides call East and West -- becomes a place of
# its own, drawn along that part. `accessibility` restates each guide's facts
# in our own words; the guides themselves are linked, not copied.
walks:
  href: https://wp.stolaf.edu/naturallands/wellness-walks/
  walks:
    - trail: trail-bigpondloop
      minutes: [14, 17]
      pdf: https://wp.stolaf.edu/naturallands/files/2025/10/Wellness-Walks_-Big-Pond-Loop.pdf
      accessibility: Wide mowed grass and a stretch of gravel road; flat but for a small rise onto Campus Drive; two benches.
    - trail: trail-norwayvalleytrail
      minutes: [15, 15]
      pdf: https://wp.stolaf.edu/naturallands/files/2025/10/Suggested-Walks_-Norway-Valley-2.pdf
      accessibility: Narrow gravel and dirt, 4 feet wide at most, up a steep hill with short steps.
    - trail: trail-windmilltrail
      minutes: [13, 16]
      pdf: https://wp.stolaf.edu/naturallands/files/2025/09/Wellness-Walks_-Windmill-Trail.pdf
      accessibility: A mowed path, 10 feet wide, with one bench; ruts in the low wetland stretch; downhill into the conifers at the northwest end.
    - trail: trail-lowerheathcreektrail
      minutes: [20, 20]
      pdf: https://wp.stolaf.edu/naturallands/files/2025/10/Wellness-Walks_-Lower-Heath-Creek-Trail.pdf
      accessibility: A footpath along Heath Creek, with roots, ruts and steep stretches; not an easy walk.
    - name: East Prairie Loop
      part: {trail: Prairie Loop, index: 0}
      minutes: [12, 15]
      pdf: https://wp.stolaf.edu/naturallands/files/2025/10/Suggested-Walks_-East-Prairie-Loop-2.pdf
      accessibility: A mowed dirt path, 10 feet wide, gently up and down; one bench.
    - name: West Prairie Loop
      part: {trail: Prairie Loop, index: 1}
      minutes: [15, 18]
      pdf: https://wp.stolaf.edu/naturallands/files/2025/09/Wellness-Walks_-West-Prairie-Loop.pdf
      accessibility: A mowed path, 10 feet wide, with one bench; flat but for small dips near the Coyote Ponds.
